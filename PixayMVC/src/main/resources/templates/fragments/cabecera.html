<nav class="fondo-header row p-2 navbar navbar-expand-sm fixed-top" th:fragment="cabecera">
    <div class="col-2">
        <div class=" ps-2">
            <a th:href="@{/}">
                <img  class="logo" th:src="@{/imagenes/logo.png}" alt="logo">
            </a>
        </div>
    </div>
    <div class="col-8 d-flex justify-content-center mt-2 ">
        <div class="search-group d-flex w-100">
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle"
                        type="button" id="Menu1"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                    [[${selectedCategoryName != null ? selectedCategoryName : 'Todas las categorías'}]]
                </button>
                <ul class="dropdown-menu" aria-labelledby="Menu1">
                    <li><a class="dropdown-item" th:href="@{/busqueda}">Todas las categorías</a></li>
                    <li th:each="cat : ${headerCategories}">
                        <a class="dropdown-item" th:href="@{/busqueda(categoryId=${cat.id})}" th:text="${cat.name}"></a>
                    </li>
                </ul>
            </div>
            <form class="d-flex flex-grow-1 bg-white align-items-center pr-2 br-search" th:action="@{/busqueda}" method="get">
                <input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
                <input type="hidden" name="subcategoryId" th:value="${selectedSubcategoryId}">

                <input name="query" class="form-control search-input"
                       type="text" placeholder="Buscar..."
                       th:value="${query}">
                <button type="submit" class="search-icon-btn br-search">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>
    </div>
    <div class="col-1 d-flex align-items-center justify-content-center">
        <div class="dropdown notification-container">
            <button class="btn btn-link p-0 text-white position-relative" id="notificationsDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-bell-fill bell-icon"></i>
                <span id="notificationsCount"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      th:classappend="${unreadNotificationsCount > 0} ? '' : ' d-none'"
                      th:text="${unreadNotificationsCount}">0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end p-0" aria-labelledby="notificationsDropdown" style="width: 320px;">
                <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                    <span class="fw-bold small">Notificaciones</span>
                    <button id="markAllReadBtn" class="btn btn-sm btn-link text-decoration-none">Marcar todo</button>
                </div>
                <div id="notificationsList" style="max-height: 320px; overflow-y: auto;">
                    <div class="px-3 py-2 text-muted small">No hay notificaciones.</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-2">
        <div class="container-fluid d-flex justify-contetn-end align-items-center">
            <div class="dropdown" th:if="${session.username != null}">
                <a class="navbar-brand d-flex align-items-center gap-2 dropdown-toggle" th:href="@{/mi-perfil/mis-imagenes}" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="text-white small" th:text="${session.username}">Usuario</span>
                    <img th:src="${session.avatar != null ? session.avatar : '/imagenes/sin-foto-perfil.png'}"
                         alt="Avatar Logo"
                         style="width:40px;height:40px;"
                         class="rounded-pill object-fit-cover">
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/mi-perfil/mis-imagenes}">Mis imágenes</a></li>
                    <li><a class="dropdown-item" th:href="@{/configuracion}">Mis ajustes</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" th:href="@{/logout}">Cerrar sesión</a></li>
                </ul>
            </div>
            <div th:if="${session.username == null}">
                <a th:href="@{/login}" class="btn btn-outline-light rounded-pill px-4 btn-sm fw-bold">
                    <i class="bi bi-person-circle me-1"></i> Iniciar sesión
                </a>
            </div>
        </div>
    </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    (() => {
        const currentUserId = /*[[${currentUserId}]]*/ null;
        if (!currentUserId) return;

        const countBadge = document.getElementById('notificationsCount');
        const listEl = document.getElementById('notificationsList');
        const markAllBtn = document.getElementById('markAllReadBtn');

        function setCount(count) {
            const safe = Number.isFinite(count) ? count : 0;
            if (safe <= 0) {
                countBadge.classList.add('d-none');
                countBadge.textContent = '0';
            } else {
                countBadge.classList.remove('d-none');
                countBadge.textContent = String(safe);
            }
        }

        function escapeHtml(value) {
            return (value ?? '').replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m]));
        }

        function renderNotifications(items) {
            if (!items || items.length === 0) {
                listEl.innerHTML = '<div class="px-3 py-2 text-muted small">No hay notificaciones.</div>';
                return;
            }

            listEl.innerHTML = items.map(n => {
                const alreadyRead = (n.isRead ?? n.read) === true;
                return `
                <button class="dropdown-item py-2 border-bottom notification-item ${alreadyRead ? '' : 'fw-semibold'}"
                        data-id="${n.id}" type="button">
                    <div class="small">${escapeHtml(n.message)}</div>
                    <div class="text-muted" style="font-size: 0.75rem;">${new Date(n.createdAt).toLocaleString()}</div>
                </button>
            `;
            }).join('');

            listEl.querySelectorAll('.notification-item').forEach(el => {
                el.addEventListener('click', async () => {
                    const id = el.getAttribute('data-id');
                    try {
                        await fetch(`/notificaciones/${id}/leer`, { method: 'PATCH' });
                        el.classList.remove('fw-semibold');
                        await refreshCount();
                    } catch (_) {}
                });
            });
        }

        async function refreshList() {
            try {
                const res = await fetch('/notificaciones');
                if (!res.ok) return;
                const items = await res.json();
                renderNotifications(items);
            } catch (_) {}
        }

        async function refreshCount() {
            try {
                const res = await fetch('/notificaciones/no-leidas/count');
                if (!res.ok) return;
                const json = await res.json();
                setCount(json.count ?? 0);
            } catch (_) {}
        }

        function prependRealtime(notification) {
            const currentItems = [...listEl.querySelectorAll('.notification-item')];
            const html = `
                <button class="dropdown-item py-2 border-bottom notification-item fw-semibold"
                        data-id="${notification.id}" type="button">
                    <div class="small">${escapeHtml(notification.message)}</div>
                    <div class="text-muted" style="font-size: 0.75rem;">Ahora</div>
                </button>
            `;
            if (currentItems.length === 0 || listEl.textContent.includes('No hay notificaciones')) {
                listEl.innerHTML = html;
            } else {
                listEl.insertAdjacentHTML('afterbegin', html);
            }
            const first = listEl.querySelector('.notification-item');
            if (first) {
                first.addEventListener('click', async () => {
                    const id = first.getAttribute('data-id');
                    try {
                        await fetch(`/notificaciones/${id}/leer`, { method: 'PATCH' });
                        first.classList.remove('fw-semibold');
                        await refreshCount();
                    } catch (_) {}
                });
            }
        }

        markAllBtn?.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch('/notificaciones/leer-todas', { method: 'PATCH' });
                await Promise.all([refreshList(), refreshCount()]);
            } catch (_) {}
        });

        refreshList();
        refreshCount();

        try {
            const socket = new SockJS('http://localhost:8081/ws');
            const stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, () => {
                stompClient.subscribe(`/topic/notifications/${currentUserId}`, (msg) => {
                    const payload = JSON.parse(msg.body);
                    prependRealtime(payload);
                    const current = parseInt(countBadge.textContent || '0', 10);
                    setCount((Number.isNaN(current) ? 0 : current) + 1);
                });
            });
        } catch (_) {}
    })();
    /*]]>*/
</script>
