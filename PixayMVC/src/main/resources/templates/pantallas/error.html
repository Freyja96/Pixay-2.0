<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pixay - Error</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center vh-100">
<div th:insert="~{fragments/cabecera}"></div>

<div class="text-center mt-5 pt-5 pb-0 mb-0">
    <h1 class="textoError">Oops!</h1>
    <h2 class="textoError">Parece que el gato ha estado trasteando con los cables...</h2>
    <p>
        <a th:href="@{/}" class="textoError">Volver a la página</a>
    </p>

    <img th:src="@{/imagenes/gato-mensaje-error.png}" class="error-img" alt="Error"/>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS propio -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        if (window.bootstrap) {
            const dropdownElementList = document.querySelectorAll('.dropdown-toggle');
            dropdownElementList.forEach(el => new bootstrap.Dropdown(el));
        }
        const seccion = [[${seccion}]];
        const query = [[${query}]] || "";

        const categoryId = [[${selectedCategoryId}]] || "";
        const subcategoryId = [[${selectedSubcategoryId}]];
    });
</script>
</body>
</html>
