<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixay - Inicio</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Masonry y imagesLoaded -->
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>
<body>
<!--CABECERA-->
<div th:insert="~{/fragments/cabecera}"></div>
<!--CUERPO-->
<div class="container mt-5">
    <!--MIGA DE PAN-->
    <h6 class="text-orange fw-bold mb-4">Inicio</h6>
    <!--GALERÍA-->
    <div class="masonry-wrapper">
        <div class="masonry-container" id="gallery-container">
            <div th:each="img : ${imagenes}" class="masonry-item">
                <div class="gallery-item">
                    <a th:href="@{/imagen/{id}(id=${img.id})}">
                        <img th:src="'data:image/jpeg;base64,' + ${img.getContentBase64()}"
                             th:alt="${img.title}"
                             loading="lazy">
                    </a>
                </div>
            </div>
        </div>
    </div>
    <!-- SCROLL INFINITO CON SPINNER -->
    <div id="loading-sentinel" class="text-center mt-4">
        <div class="spinner-border text-info" role="status"></div>
        <p class="text-muted">Cargando más arte...</p>
    </div>
    <!-- FOOTER -->
    <div th:if="${session.usuarioIdLogueado != null}"
         th:insert="~{/fragments/footer}"></div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS propio -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        if (window.bootstrap) {
            const dropdownElementList = document.querySelectorAll('.dropdown-toggle');
            dropdownElementList.forEach(el => new bootstrap.Dropdown(el));
        }

        let currentPage = 0;
        let isLoading = false;

        const seccion = [[${seccion}]];
        const query = [[${query}]] || "";

        const categoryId = [[${selectedCategoryId}]] || "";
        const subcategoryId = [[${selectedSubcategoryId}]];

        const container = document.getElementById('gallery-container');
        const sentinel = document.getElementById('loading-sentinel');

        let msnry = new Masonry(container, {
            itemSelector: '.masonry-item',
            columnWidth: '.masonry-item',
            percentPosition: true,
            transitionDuration: '0.2s'
        });
        imagesLoaded(container, () => msnry.layout());
        function loadMoreImages() {
            if (isLoading) return;
            isLoading = true;
            const nextPage = currentPage + 1;

            fetch(`/imagenes?page=${nextPage}&size=12`)
                .then(response => response.json())
                .then(data => {
                    console.log("Inicio - Fotos recibidas: " + data.content.length);

                    if (data.content.length > 0) {
                        currentPage = nextPage;
                        const newItems = [];
                        data.content.forEach(img => {
                            const div = document.createElement('div');
                            div.className = 'masonry-item';
                            div.innerHTML = `
                                <div class="gallery-item">
                                    <a href="/imagen/${img.id}">
                                        <img src="data:image/jpeg;base64,${img.contentBase64}" alt="${img.title}" loading="lazy">
                                    </a>
                                </div>`;
                            container.appendChild(div);
                            newItems.push(div);
                        });
                        imagesLoaded(container, () => {
                            msnry.appended(newItems);
                            msnry.layout();
                        });
                    }

                    if (data.last || data.content.length === 0) {
                        console.log("No hay más imágenes que cargar.");
                        if (sentinel) {
                            observer.unobserve(sentinel);
                            sentinel.style.display = 'none';
                        }
                    }
                    isLoading = false;
                })
                .catch(err => {
                    console.error("Error scroll inicio:", err);
                    isLoading = false;
                });
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading) {
                console.log("¡Sentinel detectado en Inicio!");
                loadMoreImages();
            }
        }, {
            root: null,
            threshold: 0,
            rootMargin: '100px'
        });

        if (sentinel) observer.observe(sentinel);
    });
</script>
</body>
</html>
