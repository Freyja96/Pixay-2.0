<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pixay - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>
<body>

<img th:src="@{/imagenes/logo.png}" class="login-logo" alt="Pixay"/>
<div class="container d-flex align-items-center justify-content-center vh-50">
    <div class="card">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 login-title">Iniciar sesión</h3>
            <!-- Mensaje de registro completado -->
            <div th:if="${param.registrado}" class="alert alert-success border-0 shadow-sm mb-4">
                ¡Registro completado! Ya puedes iniciar sesión.
            </div>
            <!-- Error message -->
            <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                Nombre de usuario o contraseña invalido(s).
            </div>
            <!-- Logout message -->
            <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                Cierre de sesión exitoso.
            </div>
            <!-- Nombre de usuario -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Usuario" autofocus>
                </div>
            <!-- Contraseña -->
                <div class="mb-3 position-relative">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña">
                    <i class="bi bi-eye-slash eye-toggle" id="togglePassword"></i>
                </div>
                <p class="mt-3 mb-0 orange-text text-decoration-underline">¿Olvidaste la contraseña?</p>
                <div class="d-flex justify-content-center mt-3">
            <!-- Login -->
                    <button type="submit" class="btn btn-primary login-button">INICIAR SESIÓN</button>
                </div>

            </form>
            <p class="text-center mt-3 mb-0 orange-text">
                ¿No tienes cuenta? <a class="orange-text" th:href="@{/registro}">Regístrate</a>
            </p>


            <p class="text-center mt-3 mb-0 text-muted">

            Demo users: admin / juan / maria / julia (password = admin123)
            </p>
        </div>
    </div>
</div>
<script>
    function setupPasswordToggle(toggleId, inputId) {
        const toggle = document.querySelector(toggleId);
        const input = document.querySelector(inputId);

        toggle.addEventListener('click', function () {

            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);

            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });
    }

    setupPasswordToggle('#togglePassword', '#password');
</script>
</body>
</html>
