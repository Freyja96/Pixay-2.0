<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixay - Mis imágenes</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Masonry y imagesLoaded -->
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" th:href="@{/css/inicio.css}">
</head>
<body>
<!--CABECERA-->
<div th:insert="~{/fragments/cabecera}"></div>
<!--CUERPO-->
<div class="container mt-5">
    <!--MIGA DE PAN-->
    <h6 class="text-orange fw-bold mb-4">Mi perfil</h6>
    <!--DATOS DEL USUARIO-->
    <div class="row">
        <div class="col-12 mb-5">
            <div class="d-flex align-items-start gap-4">
                <img th:src="${usuario.fotoBase64 != null ? 'data:image/jpeg;base64,' + usuario.fotoBase64 : '/imagenes/sin-foto-perfil.png'}"
                     th:alt="${usuario.username}"
                     class="rounded-circle shadow-sm"
                     style="width: 150px; height: 150px; object-fit: cover;">

                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="fw-bold text-navy mb-0" th:text="${usuario.username}">Nombre Usuario</h2>

                        <div th:if="${session.usuarioIdLogueado != null && usuario.id == session.usuarioIdLogueado}">
                            <button class="btn btn-primary px-4 py-2" style="border-radius: 8px;">
                                <a th:href="@{/mi-perfil/editar-perfil}" style="text-decoration: none; color: white">Editar perfil</a>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mb-4">
                        <button class="btn btn-outline-dark px-4" style="border-radius: 10px;">
                            <span th:text="${usuario.followersCount}">0</span> seguidores
                        </button>
                        <button class="btn btn-outline-dark px-4" style="border-radius: 10px;">
                            <span th:text="${usuario.followingCount}">0</span> seguidos
                        </button>
                        <div th:if="${session.usuarioIdLogueado != null && usuario.id != session.usuarioIdLogueado}">
                            <form th:action="@{/usuario/{id}/seguir(id=${usuario.id})}" method="post">
                                <button type="submit"
                                        th:class="${usuario.isFollowing} ? 'btn btn-outline-dark px-4' : 'btn btn-primary px-4'"
                                        style="border-radius: 10px;">
                                    <span th:text="${usuario.isFollowing} ? 'Dejar de seguir' : 'Seguir'">Seguir</span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <span th:if="${usuario.publicProfile}" class="badge bg-success mt-2">
                            <i class="bi bi-globe me-1"></i> Perfil público
                        </span>
                    <span th:if="${!usuario.publicProfile}" class="badge bg-secondary mt-2">
                            <i class="bi bi-lock-fill me-1"></i> Perfil privado
                    </span>
                    <p class="text-muted" style="max-width: 800px; line-height: 1.6;"
                    th:text="${usuario.description != null ? usuario.description : 'Este usuario aún no tiene biografía.'}">
                        Descripción del usuario...
                    </p>
                </div>
            </div>
        </div>

        <div class="col-12 mb-4">
            <div class="row g-0 border-bottom">
                <div class="col-6">
                    <a th:href="${session.usuarioIdLogueado != null && usuario.id == session.usuarioIdLogueado ? '/mi-perfil/mis-imagenes' : '/usuario/' + usuario.id}"
                       class="btn w-100 py-3 fw-bold"
                       th:classappend="${seccion != 'guardadas' ? 'btn-primary' : 'btn-outline-secondary border-0'}"
                       style="border-radius: 10px 10px 0 0;">
                        Mis imágenes
                    </a>
                </div>
                <div class="col-6">
                    <a th:href="${session.usuarioIdLogueado != null && usuario.id == session.usuarioIdLogueado ? '/mi-perfil/guardadas' : '/usuario/' + usuario.id + '/guardadas'}"
                       class="btn w-100 py-3 fw-bold"
                       th:classappend="${seccion == 'guardadas' ? 'btn-primary' : 'btn-outline-secondary border-0'}"
                       style="border-radius: 10px 10px 0 0;">
                        Imágenes guardadas
                    </a>
                </div>
            </div>
        </div>
    </div>
    <!--GALERÍA-->
    <div class="masonry-wrapper mb-5 pb-5">
        <div class="masonry-container" id="gallery-container">
            <div th:each="img : ${imagenes}" class="masonry-item">
                <div class="gallery-item">
                    <a th:href="@{/imagen/{id}(id=${img.id})}">
                        <img th:src="'data:image/jpeg;base64,' + ${img.getContentBase64()}"
                             th:alt="${img.title}"
                             loading="lazy">
                    </a>
                </div>
            </div>
        </div>
    </div>
    <!--SCROLL INFINITO CON SPINNER-->
    <div id="loading-sentinel" class="text-center"><!-- th:if="${hasNext}">-->
        <div class="spinner-border text-info" role="status"></div>
        <p class="text-muted">Cargando tu arte...</p>
    </div>
    <!--FOOTER-->
    <div th:if="${session.usuarioIdLogueado != null && usuario.id == session.usuarioIdLogueado}"
         th:insert="~{/fragments/footer}"></div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- JS propio -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        if (window.bootstrap) {
            const dropdownElementList = document.querySelectorAll('.dropdown-toggle');
            dropdownElementList.forEach(el => {
                new bootstrap.Dropdown(el);
            });
            console.log("Sistema de menús activado");
        }
        let currentPage = 0;
        let isLoading = false;

        const userId = [[${usuario.id}]];
        const seccion = [[${seccion}]];
        const query = [[${query}]] || "";

        const categoryId = [[${selectedCategoryId}]];
        const subcategoryId = [[${selectedSubcategoryId}]];
        const container = document.getElementById('gallery-container');
        const sentinel = document.getElementById('loading-sentinel');

        let msnry = new Masonry(container, {
        itemSelector: '.masonry-item',
        columnWidth: '.masonry-item',
        percentPosition: true,
        transitionDuration: '0.2s'
    });

    imagesLoaded(container, () => msnry.layout());

    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoading) {
            console.log("¡Sentinel detectado! Cargando más...");
            loadMoreImages();
        }
    }, {
        root: null,
        threshold: 0.1,
        rootMargin: '200px'
    });

    if (sentinel) observer.observe(sentinel);

    function loadMoreImages() {
        if (isLoading) return;
        isLoading = true;
        const nextPage = currentPage + 1;

        let url = (seccion === 'guardadas')
            ? `/mi-perfil/guardadas/scroll?userId=${userId}&page=${nextPage}&size=12`
            : `/mi-perfil/mis-imagenes/scroll?userId=${userId}&page=${nextPage}&size=12`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.content.length > 0) {
                    currentPage = nextPage;
                    const newItems = [];

                    data.content.forEach(img => {
                        const div = document.createElement('div');
                        div.className = 'masonry-item';
                        div.innerHTML = `
                        <div class="gallery-item">
                            <a href="/imagen/${img.id}">
                                <img src="data:image/jpeg;base64,${img.contentBase64}" alt="${img.title}" loading="lazy">
                            </a>
                        </div>`;

                        container.appendChild(div);
                        newItems.push(div);
                    });

                    imagesLoaded(container, () => {
                        msnry.appended(newItems);
                        msnry.layout();
                    });
                }

                if (!data.hasNext || data.content.length === 0) {
                    observer.unobserve(sentinel);
                    sentinel.style.display = 'none';
                }
                isLoading = false;
            })
            .catch(err => {
                console.error("Error en el scroll:", err);
                isLoading = false;
            });
    }
});
</script>
</body>
</html>
